name: Push build

on:
  push:

permissions:
  contents: write

concurrency:
  group: push-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  increment-and-build:
    # Only real pushes to the default branch create numbered firmware builds.
    # Commits created with GITHUB_TOKEN normally do not recursively trigger
    # workflows; the actor guard is an additional safeguard.
    if: github.actor != 'github-actions[bot]' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Increment BUILD locally
        id: build
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < BUILD)"

          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "BUILD must contain an integer, got: $current" >&2
            exit 1
          fi

          next=$((current + 1))
          printf '%s\n' "$next" > BUILD
          echo "number=$next" >> "$GITHUB_OUTPUT"
          echo "Build number for validation: $current -> $next"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build generic ESP32-S3
        run: pio run -e generic-esp32s3

      - name: Build Waveshare ESP32-S3 Touch LCD 1.85C
        run: pio run -e waveshare-1_85c

      - name: Verify branch has not moved
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          remote_sha="$(git rev-parse "origin/$branch")"

          if [[ "$remote_sha" != "${{ github.sha }}" ]]; then
            echo "Default branch moved from ${{ github.sha }} to $remote_sha while this build was running."
            echo "A newer push workflow will create the next build; skipping this BUILD commit."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit BUILD after successful firmware builds
        if: steps.branch.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD
          git commit -m "chore: build ${{ steps.build.outputs.number }} [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
